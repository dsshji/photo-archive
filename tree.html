<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="style.css">
  <title>Photos of My Life</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap');
  </style>
</head>
<body>
  <header>
    <div class="edge-text">
      <h4 class="header-text" id="reset">RESET</h4>
      <h4 class="header-text" id="expand-all">EXPAND ALL</h4>
      <h4 class="header-text" id="credits"><a href="/credits.html">CREDITS</a></h4>
    </div>
  </header>

  <svg id="tree-svg"></svg>

  <button class="main-button" id="reset">
    <span class="circle" aria-hidden="true">
    <span class="icon arrow"></span>
    </span>
    <span class="button-text">RESET TREE</span>
  </button>

  <button class="main-button" id="addPhoto">
    <span class="circle" aria-hidden="true">
    <span class="icon arrow"></span>
    </span>
    <span class="button-text">ADD PHOTO</span>
  </button>

  <button class="main-button" id="addEra">
    <span class="circle" aria-hidden="true">
    <span class="icon arrow"></span>
    </span>
    <span class="button-text">ADD ERA</span>
  </button>
  
  <dialog id="photoPopup">
    <form id="formPhoto">
    <label for="name">Photo Title:</label><br>
    <input type="text" id="name" name="name"><br>
    <label for="path">Path:</label><br>
    <input type="text" id="path" name="path"><br>
    <label for="file">Choose a photo:</label>
    <div class="container">
      <input type="file" id="file" name="file" accept="image/png, image/jpeg" />
      <button type="button" id="submitPhoto">Add Photo</button>
      <button id="closeBtnPhoto">Close</button>
    </div>
    </form>
  </dialog>

  <dialog id="eraPopup">
    <form id="formEra">
    <label for="name">Era path and name:</label><br>
    <div class="container">
      <input type="text" id="era" name="era"><br>
      <button type="button" id="submitEra">Add Era</button>
      <button id="closeBtnEra">Close</button>
    </div>
    </form>
  </dialog>

  <dialog id="nodePopup">
    <button id="closeBtnNode">✕</button>
    <h2 id="nodePopupTitle"></h2>
    <div id="nodePopupPhotos"></div>
  </dialog>

  <footer>
    <div class="edge-text">
      <h4 class="footer-text">PHOTO ARCHIVE</h4>
      <h4 class="footer-text">2026</h4>
    </div>
  </footer>

  <script src="tree.js"></script>
  <script src="storage.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
