<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="style.css">
  <title>Photos of My Life</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap');
  </style>
</head>
<body>
  <header>
    <div class="edge-text">
      <h4 class="header-text" id="home"><a href="/index.html">HOME</a></h4>
      <h2 class="header-text"><a href="/tree.html">PHOTO ARCHIVE</a></h2>
      <h4 class="header-text" id="credits"><a href="/credits.html">CONTACTS</a></h4>
    </div>
  </header>

  <div class="svg-cont" id="tree-cont">
    <svg id="tree-svg"></svg>
  </div>

  <div class="button-cont">
    <button class="main-button" id="reset">
      <span class="circle" aria-hidden="true">
      <span class="icon arrow"></span>
      </span>
      <span class="button-text">RESET</span>
    </button>

    <button class="main-button" id="addPhoto">
      <span class="circle" aria-hidden="true">
      <span class="icon arrow"></span>
      </span>
      <span class="button-text">ADD PHOTO</span>
    </button>

    <button class="main-button" id="addEra">
      <span class="circle" aria-hidden="true">
      <span class="icon arrow"></span>
      </span>
      <span class="button-text">ADD ERA</span>
    </button>

    <button class="main-button" id="delEra">
      <span class="circle" aria-hidden="true">
      <span class="icon arrow"></span>
      </span>
      <span class="button-text">DELETE ERA</span>
    </button>

    <!--
    <button class="main-button" id="export">
      <span class="circle" aria-hidden="true">
      <span class="icon arrow"></span>
      </span>
      <span class="button-text">EXPORT</span>
    </button>

    <button class="main-button" id="import">
      <span class="circle" aria-hidden="true">
      <span class="icon arrow"></span>
      </span>
      <span class="button-text">IMPORT</span>
    </button>
    -->
  </div>

  
  <dialog id="photoPopup">
    <form class="form" id="formPhoto">
      <button type="button" id="closeBtnPhoto" class="dialog-close">✕</button>
      <span class="title">ADD PHOTO</span>
      <label for="path" class="label">PATH TO ERA</label>
      <input type="text" id="path" name="path" class="form-input" placeholder="e.g. Childhood/School" required>
      <label for="file" class="upload-area">
        <svg class="upload-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M7 10V9C7 6.23858 9.23858 4 12 4C14.7614 4 17 6.23858 17 9V10C19.2091 10 21 11.7909 21 14C21 15.4806 20.1956 16.8084 19 17.5M7 10C4.79086 10 3 11.7909 3 14C3 15.4806 3.8044 16.8084 5 17.5M12 12V21M12 12L15 15M12 12L9 15" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <p class="upload-text">CLICK TO UPLOAD PHOTO</p>
        <span id="fileName" class="file-name">NO FILE SELECTED</span>
      </label>
      <input id="file" name="file" type="file" accept="image/png, image/jpeg">
      <button type="button" id="submitPhoto" class="arrange-btn">ADD</button>
    </form>
  </dialog>

  <dialog id="eraPopup">
    <form class="form" id="formEra">
      <button type="button" id="closeBtnEra" class="dialog-close">✕</button>
      <span class="title">ADD ERA</span>
      <label for="era" class="label">ERA PATH</label>
      <input type="text" id="era" name="era" class="form-input" placeholder="e.g. Childhood/School">
      <button type="button" id="submitEra" class="arrange-btn">ADD</button>
    </form>
  </dialog>

  <dialog id="delPopup">
    <form class="form" id="formDel">
      <button type="button" id="closeBtnDel" class="dialog-close">✕</button>
      <span class="title">DELETE ERA</span>
      <label for="delPath" class="label">ERA PATH</label>
      <input type="text" id="delPath" name="delPath" class="form-input" placeholder="e.g. Childhood/School">
      <button type="button" id="submitDel" class="arrange-btn">DELETE</button>
    </form>
  </dialog>

  <dialog id="confirmPopup">
    <div class="form">
      <p id="confirmMessage" class="confirm-message"></p>
      <div class="confirm-buttons">
        <button type="button" id="confirmOk" class="arrange-btn">YES</button>
        <button type="button" id="confirmCancel" class="confirm-no-btn">NO</button>
      </div>
    </div>
  </dialog>

  <dialog id="nodePopup">
    <button id="closeBtnNode" class="dialog-close">✕</button>
    <h2 id="nodePopupTitle"></h2>
    <div id="nodePopupPhotos"></div>
  </dialog>

  <footer>
    <div class="edge-text">
      <h4 class="footer-text">PHOTO ARCHIVE</h4>
      <h4 class="footer-text">2026</h4>
    </div>
  </footer>

  <script src="tree.js"></script>
  <script src="storage.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
